<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Substituição de Alimentos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <span class="badge">Tabela TACO · UNICAMP</span>
    <h1>Substituição de <em>Alimentos</em></h1>
    <p class="subtitle">Encontre equivalências calóricas entre alimentos do mesmo grupo nutricional.</p>

    <form id="form-substituicao">

      <div class="field">
        <label>1. Categoria nutricional</label>
        <div class="cat-pills" id="cat-pills">
          <span class="cat-pill" data-cat="Proteína"><span class="icon">🥩</span>Proteína</span>
          <span class="cat-pill" data-cat="Carboidrato"><span class="icon">🌾</span>Carboidrato</span>
          <span class="cat-pill" data-cat="Gordura"><span class="icon">🥑</span>Gordura</span>
          <span class="cat-pill" data-cat="Fibras"><span class="icon">🥦</span>Fibras</span>
          <span class="cat-pill" data-cat="Misto"><span class="icon">🍱</span>Misto</span>
        </div>
        <input type="hidden" id="categoria" required>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="alimento-original">2. Alimento original</label>
        <select id="alimento-original" name="alimento-original" required>
          <option value="">Selecione a categoria primeiro</option>
        </select>
      </div>

      <div class="field">
        <label for="peso-original">3. Quantidade (gramas)</label>
        <input type="number" id="peso-original" name="peso-original" min="1" placeholder="Ex: 100" required>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="alimento-substituto">4. Substituir por</label>
        <select id="alimento-substituto" name="alimento-substituto" required>
          <option value="">Selecione o alimento original primeiro</option>
        </select>
      </div>

      <button type="submit">Calcular Substituição</button>

      <div id="resultado-box">
        <div class="resultado-title">✔ Equivalência Calculada</div>
        <p class="resultado-texto"></p>
      </div>

    </form>

    <p class="taco-credit">Dados: Tabela Brasileira de Composição de Alimentos (TACO) — NEPA/UNICAMP, 4ª edição</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
